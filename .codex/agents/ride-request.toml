# Current Feature Scope

Implement the passenger ride-request flow:

POST /api/rides/requests

The passenger must be authenticated.

The endpoint creates a new RideRequest using:

- pickupZoneId
- destinationZoneId
- seats
- weatherCondition

The backend must determine:

- authenticated passenger
- ServiceZone records
- route validity
- approximate distance
- fare
- initial ride status

The client must NOT control calculated values.

---

# ServiceZone Is the Location Source of Truth

Use the existing Prisma model:

model ServiceZone {
  id        String  @id @default(uuid()) @db.Uuid
  name      String  @unique
  latitude  Decimal @db.Decimal(9, 6)
  longitude Decimal @db.Decimal(9, 6)

  createdAt DateTime @default(now())
  updatedAt DateTime @updatedAt

  pickupPools         RidePool[]    @relation("PoolPickupZone")
  pickupRequests      RideRequest[] @relation("RequestPickupZone")
  destinationRequests RideRequest[] @relation("RequestDestinationZone")
}

Do not create another location table.

Do not store arbitrary pickup/destination strings when a ServiceZone
relationship can be used.

RideRequest should reference ServiceZone using foreign keys such as:

pickupZoneId
destinationZoneId

Preserve existing relation naming/conventions where possible.

Add appropriate indexes if they do not already exist.

