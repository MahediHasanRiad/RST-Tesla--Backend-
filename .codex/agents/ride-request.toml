# Supported Route Corridors

For the MVP, route compatibility is deterministic.

Initial corridors:

MIRPUR:

mirpur-1
   ↓
mirpur-2
   ↓
mirpur-10

UTTARA:

uttara-4
   ↓
uttara-5
   ↓
uttara-6

Keep route/corridor logic outside the HTTP router.

Create a reusable route/domain service if one does not already exist.

A trip is valid when:

pickupIndex >= 0
destinationIndex >= 0
pickupIndex < destinationIndex

Example:

mirpur-1 → mirpur-10
VALID

mirpur-2 → mirpur-10
VALID

mirpur-10 → mirpur-2
INVALID for this directional corridor

mirpur-1 → uttara-6
INVALID until a corridor supporting that route exists.

Do NOT implement passenger pool matching yet.

