# Tests

Add meaningful tests for the implementation.

At minimum verify:

1. authenticated passenger can create ride request
2. status starts as REQUESTED
3. pickup ServiceZone relation is persisted
4. destination ServiceZone relation is persisted
5. unknown pickup zone is rejected
6. unknown destination zone is rejected
7. identical pickup/destination is rejected
8. unsupported corridor is rejected
9. reverse corridor is rejected
10. invalid seat count is rejected
11. unauthenticated request is rejected
12. Haversine calculation is deterministic
13. CLEAR fare calculation is correct
14. RAIN surcharge is correct
15. HEAVY_RAIN surcharge is correct
16. passengerId cannot be spoofed
17. client cannot override calculated fare
18. client cannot override distance
19. client cannot override coordinates

Follow existing testing conventions.

Do not chase coverage percentage.

Test the business rules that can break the system.

