# Distance Calculation

Use ServiceZone latitude/longitude.

Calculate approximate distance using the Haversine formula.

Example responsibility:

DistanceService.calculate(
    pickup.latitude,
    pickup.longitude,
    destination.latitude,
    destination.longitude
)

Return distance in kilometers.

Do not calculate distance inside the controller/router.

Do not use Google Maps.

Document that Haversine distance is an MVP approximation rather than
actual road distance.

---

# Fare Calculation

Implement fare calculation as reusable business logic.

Conceptual formula:

distanceCharge = distanceKm * perKmRate

subtotal =
    baseFare
    + distanceCharge

weatherAdjustment =
    subtotal * weatherSurchargeRate

estimatedFare =
    subtotal
    + weatherAdjustment

Supported MVP weather:

CLEAR      = 0%
RAIN       = 10%
HEAVY_RAIN = 20%

Keep constants/configuration centralized.

Do not scatter fare constants through controllers.

Store monetary values as integer poisha/paisa.

Avoid floating-point currency storage.

Fare calculation must be deterministic and independently testable.

---

# Request Contract

POST /api/rides/requests

Example body:

{
  "pickupZoneId": "<uuid>",
  "destinationZoneId": "<uuid>",
  "seats": 1,
  "weatherCondition": "CLEAR"
}

Do NOT accept the following as authoritative client values:

passengerId
pickupLatitude
pickupLongitude
destinationLatitude
destinationLongitude
distanceKm
baseFare
perKmRate
weatherAdjustment
estimatedFare
status

If supplied, ignore/reject them according to existing project validation conventions.

Passenger identity must come from authentication context.

---

# Validation

Validate:

- authenticated passenger exists
- pickupZoneId is a valid UUID
- destinationZoneId is a valid UUID
- pickup ServiceZone exists
- destination ServiceZone exists
- pickup != destination
- seats is an integer
- seats >= 1
- seats respects applicable MVP capacity constraints
- weatherCondition is supported
- route/corridor is supported
- pickup appears before destination

Use the project's existing error format.

Do not invent a second error-response convention.

---

